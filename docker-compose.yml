services:
  db:
    image: mysql:8.0
    container_name: lima-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: lima
      MYSQL_USER: lima
      MYSQL_PASSWORD: lima
      MYSQL_ROOT_PASSWORD: root
    command: --default-authentication-plugin=mysql_native_password
    ports:
      # host 3307 (3306 costuma já estar ocupado por um MySQL local)
      - "3307:3306"
    volumes:
      - lima-db-data:/var/lib/mysql

volumes:
  lima-db-data:
