services:
  db:
    image: postgres:16-alpine
    container_name: lima-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lima
      POSTGRES_PASSWORD: lima
      POSTGRES_DB: lima
    ports:
      - "5432:5432"
    volumes:
      - lima-db-data:/var/lib/postgresql/data

volumes:
  lima-db-data:
